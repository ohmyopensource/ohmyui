<!--
  @file badge.html
  @description Template of BadgeComponent: the status dot, the icon on either
  side, the label or the counter, and the remove button.
-->

<span
  [ngClass]="classes"
  [attr.aria-label]="ariaLabel || label || null"
  [attr.role]="removable ? 'status' : null"
>
  <!-- Status dot (standalone) -->
  @if (isDotOnly) {
  <span class="ohmyui-badge__dot" aria-hidden="true"></span>
  }
  <!-- Status dot (inline mode) -->
  @if (dot && !isDotOnly) {
  <span class="ohmyui-badge__dot" aria-hidden="true"></span>
  }
  <!-- Left icon -->
  @if (icon && iconPosition === 'left' && !isCountMode) {
  <span class="ohmyui-badge__icon ohmyui-badge__icon--left" aria-hidden="true">
    <svg [lucideIcon]="icon" [size]="iconSize"></svg>
  </span>
  }
  <!-- Content -->
  @if (!isDotOnly) { @if (isCountMode) {
  <span class="ohmyui-badge__count">{{ displayCount }}</span>
  } @else {
  <span class="ohmyui-badge__label">{{ label }}</span>
  } }
  <!-- Right icon -->
  @if (icon && iconPosition === 'right' && !isCountMode) {
  <span class="ohmyui-badge__icon ohmyui-badge__icon--right" aria-hidden="true">
    <svg [lucideIcon]="icon" [size]="iconSize"></svg>
  </span>
  }
  <!-- Remove action -->
  @if (removable) {
  <button
    class="ohmyui-badge__remove"
    type="button"
    [attr.aria-label]="removeLabel"
    (click)="onRemove($event)"
  >
    <svg [lucideIcon]="closeIcon" [size]="closeSize"></svg>
  </button>
  }
</span>
