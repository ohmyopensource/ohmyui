<!--
  @file email.html
  @description Template of EmailComponent: a mailto link with the optional
  envelope icon.
-->

<a
  [href]="mailtoHref"
  [ngClass]="emailClasses"
  [attr.aria-label]="accessibleLabel"
>
  @if (showIcon) {
  <span class="ohmyui-email-link__icon" aria-hidden="true">
    <svg [lucideIcon]="mailIcon" [size]="iconSize"></svg>
  </span>
  }
  <span class="ohmyui-email-link__text">{{ displayLabel }}</span>
</a>
