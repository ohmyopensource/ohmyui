<!--
  @file checkbox.html
  @description Template of CheckboxComponent: the native input, which stays
  interactive over the custom box, with the label, the description and the error
  message.
-->

<div [ngClass]="classes">
  <label [for]="inputId" class="ohmyui-checkbox__control">
    <input
      #nativeCheckbox
      [id]="inputId"
      type="checkbox"
      class="ohmyui-checkbox__input"
      [checked]="checked"
      [disabled]="disabled"
      [required]="required"
      [name]="name"
      [value]="value"
      [attr.aria-label]="ariaLabel || null"
      [attr.aria-describedby]="description ? inputId + '-description' : (error && errorMessage ? inputId + '-error' : null)"
      [attr.aria-invalid]="error ? 'true' : null"
      (change)="onNativeChange($event)"
      (blur)="onNativeBlur()"
    />
    <span class="ohmyui-checkbox__box" aria-hidden="true">
      @if (indeterminate) {
      <svg [lucideIcon]="indeterminateIcon" [size]="iconSize"></svg>
      } @else if (checked) {
      <svg [lucideIcon]="checkIcon" [size]="iconSize"></svg>
      }
    </span>
    @if (label) {
    <span class="ohmyui-checkbox__label">
      {{ label }} @if (required) {
      <span class="ohmyui-checkbox__required" aria-hidden="true">*</span>
      }
    </span>
    }
  </label>
  @if (description) {
  <p class="ohmyui-checkbox__description" [id]="inputId + '-description'">
    {{ description }}
  </p>
  } @if (error && errorMessage) {
  <p class="ohmyui-checkbox__error" [id]="inputId + '-error'" role="alert">
    {{ errorMessage }}
  </p>
  }
</div>
