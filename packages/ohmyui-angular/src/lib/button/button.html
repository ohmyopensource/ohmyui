<button
  [class]="classes"
  [type]="type"
  [disabled]="disabled || loading"
  [attr.aria-busy]="loading || null"
  [attr.aria-disabled]="disabled || null"
  (click)="handleClick($event)"
>
  @if (loading) {
  <span class="ohmyui-btn__spinner" aria-hidden="true"></span>
  }
  <span class="ohmyui-btn__label">{{ label }}</span>
</button>
