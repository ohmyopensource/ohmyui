<!--
  @file link.html
  @description Template of LinkComponent: an internal router link or an external
  link, with the trailing icon only on external links.
-->

@if (mode === 'internal') {
<a [routerLink]="href" [ngClass]="linkClasses">
  <span class="ohmyui-inline-link__text">{{ label }}</span>
</a>
} @if (mode === 'external') {
<a
  [href]="href"
  [target]="target"
  [rel]="externalRel"
  [ngClass]="linkClasses"
  [attr.aria-label]="accessibleLabel"
>
  <span class="ohmyui-inline-link__text">{{ label }}</span>
  @if (displayExternalIcon) {
  <span class="ohmyui-inline-link__icon" aria-hidden="true">
    <svg [lucideIcon]="externalIcon" [size]="iconSize"></svg>
  </span>
  }
</a>
}
